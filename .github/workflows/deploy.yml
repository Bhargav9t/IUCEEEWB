name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build application
        env:
          API_URL_SECRET: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          export NEXT_PUBLIC_API_URL="${API_URL_SECRET:-https://iuceeewb.onrender.com}"
          npm run build

      - name: 🚀 Deploy to Hostinger via FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" << 'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set net:timeout 15
          set net:max-retries 3
          mirror --reverse --delete --verbose --parallel=10 ./out/ ./
          quit
          EOF
