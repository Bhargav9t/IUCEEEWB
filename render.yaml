services:
  - type: web
    name: iucee-ewb-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEON_DATABASE_URL
        sync: false   # Set this in the Render dashboard — never commit the real URL
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_ADMIN_KEY
        sync: false
      - key: FRONTEND_URL
        value: "*"  # Set to * or specific Vercel URL

    healthCheckPath: /
